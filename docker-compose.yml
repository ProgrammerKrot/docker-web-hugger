version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/containers"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always

  frontend:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always
